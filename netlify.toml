
# Ensure index.html is always revalidated so deploys are picked up immediately.
# Vite hashes all JS/CSS assets, so those can be cached indefinitely.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Immutable cache for hashed assets (Vite fingerprints these)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure browsers can fetch the service-worker cleanup script and retire
# workers generated by the previously enabled PWA plugin.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
